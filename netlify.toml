# Vite 8 needs Node 20.19+ or 22.12+. An older default publishes the source
# index.html, whose /src/main.tsx script never runs, so the site stays blank.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify's asset post-processing rewrites Vite's module scripts and leaves a
# blank page. Leave the built files untouched.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false

# Set VITE_API_URL in the Netlify UI to the Railway origin, then redeploy.
# Vite inlines it at build time. The browser calls same-origin /api/v1 so this
# proxy can reach Railway; a direct browser call is rejected by Railway CORS.
# This rule must stay above the SPA fallback.

[[redirects]]
  from = "/api/*"
  to = "https://patchpilot-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
