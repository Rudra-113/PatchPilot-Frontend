<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PatchPilot AI detects vulnerabilities, explains the root cause, generates a patch, and validates the fix before it lands."
    />
    <meta name="theme-color" content="#070605" />
    <title>PatchPilot AI</title>
    <script>
      try {
        var theme = localStorage.getItem('patchpilot.theme')
        document.documentElement.classList.remove('dark', 'light')
        document.documentElement.classList.add(theme === 'light' ? 'light' : 'dark')
        document.querySelector('meta[name="theme-color"]').setAttribute(
          'content',
          theme === 'light' ? '#f3eee4' : '#070605',
        )
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
